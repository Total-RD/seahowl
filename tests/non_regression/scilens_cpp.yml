processor: ExecuteAndCompare
#processor: Compare
tags: [csv]
execute:
  pre_folder_delete:  ["output"]
  exe_guess_os_extension: true
  command_suffix: " ./data/main.json --numerics-duration 30 "
execute_and_compare:
  test:
    exe_path: "build/seahowl_driver"
  reference:
    exe_path: "ref/bin/seahowl_driver"
  #test_only: true
readers:
  csv:
    curve_parser:
      name: "col_x"
      parameters:
        x: ["time (s)", "fraction"]
compare:
  errors_limit: 10000
  float_thresholds:
    relative_vs_absolute_min: 1e-12
    relative_error_min: 1e-3
    relative_error_max: 1e-2
    absolute_error_min: 1e-7
    absolute_error_max: 1e-6
    #vectors:
      #ponderation_method: amplitude_moderation
      #amplitude_moderation_multiplier: 0.01
      #ponderation_method: RIAE_midpoint
      #riae_threshold: 0.1
      #reduction_method: ignore
      #ponderation_method: RIAE_trapezoid
      #riae_threshold: 0.01
  sources:
    test_folder_relative_path: validation
    reference_folder_relative_path: reference
    additional_path_suffix: "output"
    recursive: true
report:
  title_prefix : "Seahowl / Comparison Results /"
  output:
    export_html: true
  html:
    collapse_if_successful: false
    curves:
      display_on_load: false
    parameter_page_mode :
      default_value : tabs
  logo_file: ../../../../doc/source/_static/totalenergies_alpha.png
