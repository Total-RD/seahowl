name: Windows build

on:
  push:
    branches: [main, dev, feature-lateral-torque]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}/external/vcpkg
      # Cache vcpkg-built packages in the GH Actions cache via NuGet protocol
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install a real Fortran compiler (MSYS2 mingw-w64 gfortran). The flang
      # bundled with Visual Studio 2026 / standalone LLVM is detected as
      # "LLVMFlang" by CMake but is not compatible with vcpkg's
      # lapack-reference build on x64-windows.
      - name: Set up MSYS2 with gfortran
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc-fortran
          path-type: inherit

      # Remove LLVM/Flang from PATH so CMake doesn't pick up LLVMFlang as the
      # Fortran compiler, and prepend MSYS2 mingw64/bin so gfortran is found.
      - name: Sanitize PATH (drop flang, prepend gfortran)
        shell: pwsh
        run: |
          $bad = 'LLVM|Flang'
          $filtered = ($env:PATH.Split(';') | Where-Object { $_ -and ($_ -notmatch $bad) }) -join ';'
          $gfortran = 'C:\msys64\mingw64\bin'
          $newPath = "$gfortran;$filtered"
          "PATH=$newPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Make sure CMake/vcpkg don't pick up a stale FC pointing at flang
          "FC=$gfortran\gfortran.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          }
      # Required for VCPKG_BINARY_SOURCES=x-gha
      - name: Export GitHub Actions cache env for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Configure
        shell: pwsh
        run: cmake --preset default

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release -j

      - name: Test
        shell: pwsh
        working-directory: build
        run: ctest --output-on-failure -C Release

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: seahowl-windows-x64
          path: |
            build/**/*.exe
            build/**/*.dll
            build/**/*.pyd
          if-no-files-found: ignore
